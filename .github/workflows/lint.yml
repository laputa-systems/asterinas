name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: asterinas/kernel-dev@sha256:b2cc0b29cbd7355fc4587f3d2a2a44cac6f7e69839f023cf0f49ce2a4f1f65ed
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lint
        run: make lint
